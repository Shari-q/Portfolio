<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="150" y1="0" x2="1050" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020B12"/>
      <stop offset="0.45" stop-color="#061E27"/>
      <stop offset="1" stop-color="#020B12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 330) rotate(90) scale(360 560)">
